# Render Blueprint — one free web service runs the site, the API and Big Fish (socket.io).
# Data lives in Turso (free) so it survives Render's throwaway disk and restarts.
services:
  - type: web
    name: bible-krillion
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: corepack enable pnpm && pnpm install --frozen-lockfile && pnpm build
    startCommand: npm start
    healthCheckPath: /api/meta
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: LAUNCH_DATE
        value: 2026-11-23
      # signs anonymous player tokens; generated once by Render and kept
      - key: PLAYER_SECRET
        generateValue: true
      # from Turso: `libsql://<db>-<org>.turso.io` and a database token — entered in the Render dashboard
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
